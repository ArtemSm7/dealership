{% extends 'main/base.html' %}

{% block content %}
<div class="page-header d-print-none mb-4">
    <h2 class="page-title text-danger">❤ Моё Избранное</h2>
</div>

<div class="row row-cards">
    {% for car in cars %}
    <div class="col-sm-6 col-lg-4">
        {% include 'main/includes/car_card.html' with car=car %}
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">
            У вас пока нет избранных автомобилей. 
            <a href="{% url 'catalog' %}">Перейти в каталог</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
